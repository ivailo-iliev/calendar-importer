<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schedule Import</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f5f5f3, #111315);
        --panel: light-dark(#fcfcfa, #171a1d);
        --ink: light-dark(#1a1d21, #f2f4f6);
        --muted: light-dark(#5f6873, #a9b1ba);
        --line: light-dark(rgb(26 29 33 / 0.12), rgb(242 244 246 / 0.12));
        --accent: light-dark(#0b57d0, #8ab4f8);
        --field-bg: light-dark(#ffffff, #20252b);
        --field-ink: light-dark(#1a1d21, #f2f4f6);
        --ok: light-dark(#166534, #86efac);
        --ok-bg: light-dark(#edf9f0, #112018);
        --ok-line: light-dark(#86d19d, #2f6f44);
        --err: light-dark(#b42318, #ff9b8f);
        --err-bg: light-dark(#fef3f2, #231516);
        --err-line: light-dark(#f3b0aa, #7a2e28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      main {
        max-width: 57.5rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 2.5rem;
      }

      .panel {
        background: var(--panel);
        border: 0.0625rem solid var(--line);
        border-radius: 1rem;
        box-shadow: 0 0.75rem 2rem rgb(0 0 0 / 0.08);
        overflow: hidden;
      }

      .header {
        padding: 1.25rem 1.375rem 0.875rem;
        border-bottom: 0.0625rem solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 1.875rem;
        line-height: 1.1;
      }

      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
        align-items: end;
        padding: 1rem 1.375rem 0;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.6875rem 1rem;
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: light-dark(#ffffff, #08111f);
      }

      button.secondary {
        background: var(--field-bg);
        color: var(--ink);
        border: 0.0625rem solid var(--line);
      }

      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .calendar-picker {
        flex: 1 1 15rem;
        min-width: 13.75rem;
      }

      label {
        display: block;
        margin-bottom: 0.375rem;
        color: var(--muted);
        font-size: 0.875rem;
      }

      select {
        width: 100%;
        border: 0.0625rem solid var(--line);
        border-radius: 0.75rem;
        padding: 0.625rem 0.75rem;
        font: inherit;
        color: var(--field-ink);
        background: var(--field-bg);
        -webkit-appearance: none;
        appearance: none;
      }

      .status {
        margin: 1rem 1.375rem 0;
        padding: 0.75rem 0.875rem;
        border-radius: 0.75rem;
        background: var(--field-bg);
        border: 0.0625rem solid var(--line);
        white-space: pre-wrap;
      }

      .status.ok {
        border-color: var(--ok-line);
        color: var(--ok);
        background: var(--ok-bg);
      }

      .status.error {
        border-color: var(--err-line);
        color: var(--err);
        background: var(--err-bg);
      }

      .grid {
        padding: 1rem 1.375rem 1.375rem;
      }

      .editor {
        position: relative;
      }

      .overlay-actions {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        z-index: 1;
        display: inline-flex;
        gap: 0.5rem;
      }

      .overlay-action {
        min-width: 2.75rem;
        min-height: 2.75rem;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        background: var(--field-bg);
        color: var(--ink);
        box-shadow: 0 0.5rem 1rem rgb(0 0 0 / 0.08);
      }

      textarea {
        width: 100%;
        min-height: 26.25rem;
        resize: vertical;
        border: 0.0625rem solid var(--line);
        border-radius: 0.875rem;
        padding: 3.75rem 1rem 1rem;
        font: 0.875rem/1.5 monospace;
        color: var(--field-ink);
        background: var(--field-bg);
      }

      .footer {
        padding: 0 1.375rem 1.375rem;
        font-size: 0.875rem;
        color: var(--muted);
      }

      .footer a {
        color: var(--accent);
      }

      code {
        font-family: monospace;
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="header">
          <h1>Schedule Import</h1>
          <p>Paste or load expanded JSON, sign in with Google, then create calendar events.</p>
        </div>
        <div class="controls">
          <button id="auth-action" type="button">Connect</button>
          <div class="calendar-picker">
            <label for="calendar-select">Target calendar</label>
            <select id="calendar-select" disabled>
              <option value="primary">Primary</option>
            </select>
          </div>
          <button id="create-events" type="button" disabled>Create Events</button>
        </div>
        <div id="status" class="status">Loading configuration…</div>
        <div class="grid">
          <div class="editor">
            <div class="overlay-actions">
              <button
                id="paste-json"
                type="button"
                class="overlay-action secondary"
                aria-label="Paste JSON"
                title="Paste JSON"
              >📋</button>
              <button
                id="format-json"
                type="button"
                class="overlay-action secondary"
                aria-label="Format JSON"
                title="Format JSON"
              >✨</button>
            </div>
            <textarea id="payload" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="footer">
          <a href="https://github.com/ivailo-iliev/practice-calendar" target="_blank" rel="noreferrer">View source on GitHub</a>
        </div>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const payloadEl = document.getElementById("payload");
      const authActionBtn = document.getElementById("auth-action");
      const pasteBtn = document.getElementById("paste-json");
      const formatBtn = document.getElementById("format-json");
      const createBtn = document.getElementById("create-events");
      const calendarSelectEl = document.getElementById("calendar-select");

      const GOOGLE_SCOPES = [
        "https://www.googleapis.com/auth/calendar.events",
        "https://www.googleapis.com/auth/calendar.calendarlist.readonly",
      ].join(" ");
      const ACCESS_TOKEN_STORAGE_KEY = "scheduleImportGoogleAccessToken";
      const ACCESS_TOKEN_EXPIRY_STORAGE_KEY = "scheduleImportGoogleAccessTokenExpiry";
      const ACCESS_TOKEN_EXPIRY_SKEW_MS = 30 * 1000;

      let accessToken = "";
      let tokenClient = null;
      let googleClientId = "";
      let authInProgress = false;
      let authProgressTimeoutId = null;
      let googleAuthUnavailable = false;

      function startAuthProgress() {
        authInProgress = true;
        if (authProgressTimeoutId) {
          window.clearTimeout(authProgressTimeoutId);
        }
        authProgressTimeoutId = window.setTimeout(() => {
          authInProgress = false;
          authProgressTimeoutId = null;
          updateAuthUi();
        }, 10000);
        updateAuthUi();
      }

      function finishAuthProgress() {
        authInProgress = false;
        if (authProgressTimeoutId) {
          window.clearTimeout(authProgressTimeoutId);
          authProgressTimeoutId = null;
        }
        updateAuthUi();
      }

      function persistAccessToken(token, expiresInSeconds) {
        if (!token) return;
        const expiresInMs = Number(expiresInSeconds) > 0 ? Number(expiresInSeconds) * 1000 : 0;
        const expiresAt = Date.now() + expiresInMs;
        try {
          window.localStorage.setItem(ACCESS_TOKEN_STORAGE_KEY, token);
          if (expiresInMs > 0) {
            window.localStorage.setItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY, String(expiresAt));
          } else {
            window.localStorage.removeItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY);
          }
        } catch (error) {
          // Ignore localStorage failures and continue in-memory only.
        }
      }

      function clearPersistedAccessToken() {
        try {
          window.localStorage.removeItem(ACCESS_TOKEN_STORAGE_KEY);
          window.localStorage.removeItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY);
        } catch (error) {
          // Ignore localStorage failures and continue in-memory only.
        }
      }

      function restoreAccessTokenFromStorage() {
        try {
          const storedToken = window.localStorage.getItem(ACCESS_TOKEN_STORAGE_KEY) || "";
          const storedExpiryRaw = window.localStorage.getItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY) || "";
          const storedExpiry = Number(storedExpiryRaw);
          const hasExpiry = Number.isFinite(storedExpiry) && storedExpiry > 0;
          if (!storedToken) return "";
          if (hasExpiry && storedExpiry - ACCESS_TOKEN_EXPIRY_SKEW_MS <= Date.now()) {
            clearPersistedAccessToken();
            return "";
          }
          return storedToken;
        } catch (error) {
          return "";
        }
      }

      function selectedCalendarId() {
        return calendarSelectEl.value || "primary";
      }

      function populateCalendars(calendars) {
        const items = Array.isArray(calendars) ? calendars.slice() : [];
        items.sort((a, b) => {
          if (a.primary && !b.primary) return -1;
          if (!a.primary && b.primary) return 1;
          return String(a.summary || "").localeCompare(String(b.summary || ""));
        });
        calendarSelectEl.innerHTML = "";
        if (!items.length) {
          const option = document.createElement("option");
          option.value = "primary";
          option.textContent = "Primary";
          calendarSelectEl.appendChild(option);
          calendarSelectEl.disabled = true;
          return;
        }
        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.primary ? `${item.summary} (Primary)` : item.summary;
          calendarSelectEl.appendChild(option);
        }
        calendarSelectEl.disabled = false;
      }

      function setStatus(message, kind = "") {
        statusEl.className = `status${kind ? ` ${kind}` : ""}`;
        statusEl.textContent = message;
      }

      const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
      const TIME_RE = /^\d{2}:\d{2}$/;

      function isValidDate(value) {
        if (typeof value !== "string" || !DATE_RE.test(value)) return false;
        const [year, month, day] = value.split("-").map(Number);
        const date = new Date(Date.UTC(year, month - 1, day));
        return (
          date.getUTCFullYear() === year
          && date.getUTCMonth() === month - 1
          && date.getUTCDate() === day
        );
      }

      function isValidTime(value) {
        if (typeof value !== "string" || !TIME_RE.test(value)) return false;
        const [hour, minute] = value.split(":").map(Number);
        return hour >= 0 && hour <= 23 && minute >= 0 && minute <= 59;
      }

      function toCompactPayload(parsed) {
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("Payload must be a JSON object.");
        }

        if (Array.isArray(parsed.ev)) {
          const ev = parsed.ev.map((event, index) => {
            if (!event || typeof event !== "object" || Array.isArray(event)) {
              throw new Error(`ev[${index}] must be an object.`);
            }
            const allDay = event.ad === true;
            if (allDay && (Object.prototype.hasOwnProperty.call(event, "s") || Object.prototype.hasOwnProperty.call(event, "e"))) {
              throw new Error(`ev[${index}] cannot mix ad:true with s/e.`);
            }
            if (!allDay && Object.prototype.hasOwnProperty.call(event, "ed")) {
              throw new Error(`ev[${index}] timed events cannot include ed.`);
            }
            if (!isValidDate(event.d)) {
              throw new Error(`ev[${index}].d must be YYYY-MM-DD.`);
            }
            if (typeof event.t !== "string" || !event.t.trim()) {
              throw new Error(`ev[${index}].t must be a non-empty string.`);
            }
            if (allDay) {
              if (Object.prototype.hasOwnProperty.call(event, "ed")) {
                if (!isValidDate(event.ed) || event.ed <= event.d) {
                  throw new Error(`ev[${index}].ed must be a valid date after d (exclusive end).`);
                }
              }
              return event.ed
                ? { d: event.d, ed: event.ed, ad: true, t: event.t.trim() }
                : { d: event.d, ad: true, t: event.t.trim() };
            }
            if (!isValidTime(event.s) || !isValidTime(event.e) || event.e <= event.s) {
              throw new Error(`ev[${index}] timed events require valid s/e with s < e.`);
            }
            return { d: event.d, s: event.s, e: event.e, t: event.t.trim() };
          });
          return {
            tz: typeof parsed.tz === "string" && parsed.tz.trim() ? parsed.tz.trim() : "Europe/Sofia",
            ev,
          };
        }

        if (!Array.isArray(parsed.events)) {
          throw new Error("Expanded payload must include an events array.");
        }

        const timezone = typeof parsed.timezone === "string" && parsed.timezone.trim()
          ? parsed.timezone.trim()
          : "Europe/Sofia";
        const ev = parsed.events.map((event, index) => {
          if (!event || typeof event !== "object" || Array.isArray(event)) {
            throw new Error(`events[${index}] must be an object.`);
          }
          const allDay = event.allDay === true;
          if (!isValidDate(event.date)) {
            throw new Error(`events[${index}].date must be YYYY-MM-DD.`);
          }
          if (typeof event.title !== "string" || !event.title.trim()) {
            throw new Error(`events[${index}].title must be a non-empty string.`);
          }
          if (allDay) {
            if (Object.prototype.hasOwnProperty.call(event, "start") || Object.prototype.hasOwnProperty.call(event, "end")) {
              throw new Error(`events[${index}] cannot include start/end when allDay is true.`);
            }
            if (Object.prototype.hasOwnProperty.call(event, "endDate")) {
              if (!isValidDate(event.endDate) || event.endDate <= event.date) {
                throw new Error(`events[${index}].endDate must be after date (exclusive end).`);
              }
              return { d: event.date, ed: event.endDate, ad: true, t: event.title.trim() };
            }
            return { d: event.date, ad: true, t: event.title.trim() };
          }
          if (Object.prototype.hasOwnProperty.call(event, "endDate")) {
            throw new Error(`events[${index}] timed events cannot include endDate.`);
          }
          if (!isValidTime(event.start) || !isValidTime(event.end) || event.end <= event.start) {
            throw new Error(`events[${index}] timed events require valid start/end with start < end.`);
          }
          return { d: event.date, s: event.start, e: event.end, t: event.title.trim() };
        });
        return { tz: timezone, ev };
      }

      function toExpandedPayload(parsed) {
        const compact = toCompactPayload(parsed);
        return {
          timezone: compact.tz,
          events: compact.ev.map((event) => (
            event.ad
              ? {
                  date: event.d,
                  allDay: true,
                  ...(event.ed ? { endDate: event.ed } : {}),
                  title: event.t,
                }
              : {
                  date: event.d,
                  start: event.s,
                  end: event.e,
                  title: event.t,
                }
          )),
        };
      }

      function base64UrlToUint8(base64Url) {
        const padded = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const padLength = (4 - (padded.length % 4)) % 4;
        const base64 = padded + "=".repeat(padLength);
        const binary = window.atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function inflateRawToString(compressedBytes) {
        if (typeof DecompressionStream !== "function") {
          throw new Error("This browser does not support DecompressionStream.");
        }
        const ds = new DecompressionStream("deflate-raw");
        const stream = new Blob([compressedBytes]).stream().pipeThrough(ds);
        const response = new Response(stream);
        return response.text();
      }

      function updateAuthUi() {
        const connected = Boolean(accessToken);
        authActionBtn.disabled = authInProgress || googleAuthUnavailable;
        if (authInProgress) {
          authActionBtn.textContent = connected ? "Signing Out…" : "Signing In…";
        } else if (googleAuthUnavailable) {
          authActionBtn.textContent = "Google Auth Unavailable";
        } else {
          authActionBtn.textContent = connected ? "Sign Out" : "Connect";
        }
        authActionBtn.classList.toggle("secondary", connected);
        createBtn.disabled = googleAuthUnavailable || !connected || authInProgress;
        if (googleAuthUnavailable || !connected || authInProgress) {
          calendarSelectEl.disabled = true;
        }
      }

      async function loadCalendars() {
        const response = await fetch("/.netlify/functions/list-calendars", {
          headers: {
            accept: "application/json",
            authorization: `Bearer ${accessToken}`,
          },
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Failed to load calendars.");
        }
        populateCalendars(data.calendars || []);
      }

      async function decodePayloadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("payload64");
        if (!raw) {
          payloadEl.value = '{\n  "timezone": "Europe/Sofia",\n  "events": []\n}';
          setStatus("No payload64 parameter found. Paste JSON or reopen with ?payload64=...", "");
          return;
        }
        try {
          const compressed = base64UrlToUint8(raw);
          const minifiedJson = await inflateRawToString(compressed);
          const parsed = JSON.parse(minifiedJson);
          const expanded = toExpandedPayload(parsed);
          payloadEl.value = JSON.stringify(expanded, null, 2);
          setStatus("Loaded and expanded payload64 from URL.", "ok");
        } catch (error) {
          payloadEl.value = raw;
          setStatus("payload64 is not valid deflate-raw+base64url JSON. Plain deflate is not accepted by this decoder. You can correct it manually.", "error");
        }
      }

      async function loadConfig() {
        const response = await fetch("/.netlify/functions/runtime-config", {
          headers: { accept: "application/json" },
        });
        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          const bodyPreview = (await response.text()).slice(0, 120).trim();
          throw new Error(
            `Expected JSON from runtime-config but received ${contentType || "unknown content type"}${bodyPreview ? `: ${bodyPreview}` : ""}`,
          );
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Failed to load runtime config.");
        }
        googleClientId = data.googleClientId || "";
        if (!googleClientId) {
          setStatus("Missing GOOGLE_CLIENT_ID in Netlify environment.", "error");
          authActionBtn.disabled = true;
          return;
        }
        setStatus("Configuration loaded. Sign in to enable event creation.", "");
      }

      function initGoogleAuth() {
        if (!window.google || !googleClientId) {
          return;
        }
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: googleClientId,
          scope: GOOGLE_SCOPES,
          error_callback: () => {
            finishAuthProgress();
          },
          callback: (response) => {
            finishAuthProgress();
            if (response && response.access_token) {
              accessToken = response.access_token;
              persistAccessToken(accessToken, response.expires_in);
              updateAuthUi();
              loadCalendars()
                .then(() => {
                  setStatus("Google access granted. You can now create events.", "ok");
                })
                .catch((error) => {
                  setStatus(`Signed in, but failed to load calendars: ${error.message}. Try signing out and signing in again to refresh consent.`, "error");
                });
            }
          },
        });
      }

      function requestSilentAccessToken() {
        if (!tokenClient) return;
        startAuthProgress();
        try {
          tokenClient.requestAccessToken({ prompt: "" });
        } catch (error) {
          finishAuthProgress();
          // Ignore silent auth failures; user can still use explicit sign-in.
        }
      }

      function formatPayloadFromEditor() {
        const parsed = JSON.parse(payloadEl.value);
        const expanded = toExpandedPayload(toCompactPayload(parsed));
        payloadEl.value = JSON.stringify(expanded, null, 2);
      }

      authActionBtn.addEventListener("click", () => {
        if (authInProgress) return;
        if (accessToken) {
          startAuthProgress();
          if (window.google && google.accounts && google.accounts.oauth2) {
            google.accounts.oauth2.revoke(accessToken, () => {});
          }
          accessToken = "";
          clearPersistedAccessToken();
          populateCalendars([]);
          finishAuthProgress();
          setStatus("Google access revoked for this page session.", "");
          return;
        }
        if (!tokenClient) {
          setStatus("Google auth is not ready yet.", "error");
          return;
        }
        startAuthProgress();
        tokenClient.requestAccessToken({ prompt: "consent" });
      });

      formatBtn.addEventListener("click", () => {
        try {
          formatPayloadFromEditor();
          setStatus("JSON formatted.", "ok");
        } catch (error) {
          setStatus(`Cannot format JSON: ${error.message}`, "error");
        }
      });

      pasteBtn.addEventListener("click", async () => {
        if (!navigator.clipboard || typeof navigator.clipboard.readText !== "function") {
          setStatus("Clipboard paste is not supported in this browser.", "error");
          return;
        }
        try {
          payloadEl.value = await navigator.clipboard.readText();
          formatPayloadFromEditor();
          setStatus("JSON pasted and formatted.", "ok");
        } catch (error) {
          setStatus(`Cannot paste JSON: ${error.message}`, "error");
        }
      });

      createBtn.addEventListener("click", async () => {
        if (!accessToken) {
          setStatus("Sign in with Google before creating events.", "error");
          return;
        }
        setStatus("Creating events…", "");
        createBtn.disabled = true;
        try {
          const parsed = JSON.parse(payloadEl.value);
          const compactPayload = toCompactPayload(parsed);
          const compactPayloadJson = JSON.stringify(compactPayload);
          payloadEl.value = JSON.stringify(toExpandedPayload(compactPayload), null, 2);
          const url = new URL("/.netlify/functions/create-events", window.location.origin);
          url.searchParams.set("calendarId", selectedCalendarId());
          const response = await fetch(url.toString(), {
            method: "POST",
            headers: {
              "content-type": "application/json",
              authorization: `Bearer ${accessToken}`,
            },
            body: compactPayloadJson,
          });
          const data = await response.json();
          payloadEl.value = payloadEl.value.trim();
          if (!response.ok) {
            setStatus(JSON.stringify(data, null, 2), "error");
            return;
          }
          setStatus(JSON.stringify(data, null, 2), "ok");
        } catch (error) {
          setStatus(`Request failed: ${error.message}`, "error");
        } finally {
          createBtn.disabled = !accessToken;
        }
      });

      async function boot() {
        const GOOGLE_SCRIPT_MAX_WAIT_MS = 12000;
        const GOOGLE_SCRIPT_POLL_INTERVAL_MS = 100;

        await decodePayloadFromUrl();
        accessToken = restoreAccessTokenFromStorage();
        populateCalendars([]);
        updateAuthUi();
        try {
          await loadConfig();
        } catch (error) {
          setStatus(`Failed to load runtime config: ${error.message}`, "error");
          authActionBtn.disabled = true;
          return;
        }
        const googleScriptWaitStartedAt = Date.now();
        let googleScriptResolved = false;
        const resolveGoogleScriptReady = () => {
          if (googleScriptResolved) return;
          googleScriptResolved = true;
          window.clearInterval(waitForGoogle);
          initGoogleAuth();
          if (accessToken) {
            loadCalendars()
              .then(() => {
                setStatus("Restored Google access from browser storage.", "ok");
              })
              .catch(() => {
                accessToken = "";
                clearPersistedAccessToken();
                updateAuthUi();
                requestSilentAccessToken();
                setStatus("Stored Google access token expired. Attempting silent sign-in.", "");
              });
          } else {
            requestSilentAccessToken();
          }
        };
        const resolveGoogleScriptTimeout = () => {
          if (googleScriptResolved) return;
          googleScriptResolved = true;
          googleAuthUnavailable = true;
          window.clearInterval(waitForGoogle);
          updateAuthUi();
          setStatus("Google auth script failed to load in time. Authentication is unavailable, so event creation is disabled.", "error");
        };
        const waitForGoogle = window.setInterval(() => {
          if (window.google) {
            resolveGoogleScriptReady();
            return;
          }
          if (Date.now() - googleScriptWaitStartedAt >= GOOGLE_SCRIPT_MAX_WAIT_MS) {
            resolveGoogleScriptTimeout();
          }
        }, GOOGLE_SCRIPT_POLL_INTERVAL_MS);
      }

      boot();
    </script>
  </body>
</html>
