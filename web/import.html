<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schedule Import</title>
    <style>
      :root {
        --bg: #f3efe6;
        --panel: #fffaf2;
        --ink: #1f1d1a;
        --muted: #655d54;
        --line: #d8cfc1;
        --accent: #176b87;
        --accent-2: #b85c38;
        --ok: #2f6f3e;
        --err: #9d2a2a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(184, 92, 56, 0.12), transparent 32%),
          linear-gradient(180deg, #efe7da 0%, var(--bg) 100%);
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(49, 43, 35, 0.08);
        overflow: hidden;
      }

      .header {
        padding: 20px 22px 14px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
      }

      p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 16px 22px 0;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 16px;
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }

      button.secondary {
        background: #ebe2d3;
        color: var(--ink);
      }

      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 14px 22px 0;
        color: var(--muted);
        font-size: 14px;
      }

      .selector-row {
        padding: 14px 22px 0;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      select {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
        background: #fffdf8;
      }

      .status {
        margin: 16px 22px 0;
        padding: 12px 14px;
        border-radius: 12px;
        background: #f4ecdf;
        border: 1px solid var(--line);
        white-space: pre-wrap;
      }

      .status.ok {
        border-color: rgba(47, 111, 62, 0.25);
        color: var(--ok);
        background: rgba(47, 111, 62, 0.08);
      }

      .status.error {
        border-color: rgba(157, 42, 42, 0.25);
        color: var(--err);
        background: rgba(157, 42, 42, 0.08);
      }

      .grid {
        padding: 16px 22px 22px;
      }

      textarea {
        width: 100%;
        min-height: 420px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ink);
        background: #fffdf8;
      }

      .hint {
        padding: 0 22px 22px;
        font-size: 14px;
        color: var(--muted);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="header">
          <h1>Schedule Import</h1>
          <p>Paste or load expanded JSON, sign in with Google, then create calendar events.</p>
        </div>
        <div class="controls">
          <button id="auth-action" type="button">Sign In With Google</button>
          <button id="format-json" type="button" class="secondary">Format JSON</button>
          <button id="create-events" type="button" disabled>Create Events</button>
        </div>
        <div class="meta">
          <div id="auth-state">Google: not connected</div>
          <div>Default timezone: <code>Europe/Sofia</code></div>
        </div>
        <div class="selector-row">
          <label for="calendar-select">Target calendar</label>
          <select id="calendar-select" disabled>
            <option value="primary">Primary</option>
          </select>
        </div>
        <div id="status" class="status">Loading configuration…</div>
        <div class="grid">
          <textarea id="payload" spellcheck="false"></textarea>
        </div>
        <div class="hint">
          URL shape: <code>/import?payload64=&lt;deflate+base64url&gt;</code>
        </div>
      </section>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const payloadEl = document.getElementById("payload");
      const authActionBtn = document.getElementById("auth-action");
      const formatBtn = document.getElementById("format-json");
      const createBtn = document.getElementById("create-events");
      const authStateEl = document.getElementById("auth-state");
      const calendarSelectEl = document.getElementById("calendar-select");

      const GOOGLE_SCOPES = [
        "https://www.googleapis.com/auth/calendar.events",
        "https://www.googleapis.com/auth/calendar.calendarlist.readonly",
      ].join(" ");
      const ACCESS_TOKEN_STORAGE_KEY = "scheduleImportGoogleAccessToken";
      const ACCESS_TOKEN_EXPIRY_STORAGE_KEY = "scheduleImportGoogleAccessTokenExpiry";
      const ACCESS_TOKEN_EXPIRY_SKEW_MS = 30 * 1000;

      let accessToken = "";
      let tokenClient = null;
      let googleClientId = "";
      let authInProgress = false;
      let authProgressTimeoutId = null;
      let googleAuthUnavailable = false;

      function startAuthProgress() {
        authInProgress = true;
        if (authProgressTimeoutId) {
          window.clearTimeout(authProgressTimeoutId);
        }
        authProgressTimeoutId = window.setTimeout(() => {
          authInProgress = false;
          authProgressTimeoutId = null;
          updateAuthUi();
        }, 10000);
        updateAuthUi();
      }

      function finishAuthProgress() {
        authInProgress = false;
        if (authProgressTimeoutId) {
          window.clearTimeout(authProgressTimeoutId);
          authProgressTimeoutId = null;
        }
        updateAuthUi();
      }

      function persistAccessToken(token, expiresInSeconds) {
        if (!token) return;
        const expiresInMs = Number(expiresInSeconds) > 0 ? Number(expiresInSeconds) * 1000 : 0;
        const expiresAt = Date.now() + expiresInMs;
        try {
          window.localStorage.setItem(ACCESS_TOKEN_STORAGE_KEY, token);
          if (expiresInMs > 0) {
            window.localStorage.setItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY, String(expiresAt));
          } else {
            window.localStorage.removeItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY);
          }
        } catch (error) {
          // Ignore localStorage failures and continue in-memory only.
        }
      }

      function clearPersistedAccessToken() {
        try {
          window.localStorage.removeItem(ACCESS_TOKEN_STORAGE_KEY);
          window.localStorage.removeItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY);
        } catch (error) {
          // Ignore localStorage failures and continue in-memory only.
        }
      }

      function restoreAccessTokenFromStorage() {
        try {
          const storedToken = window.localStorage.getItem(ACCESS_TOKEN_STORAGE_KEY) || "";
          const storedExpiryRaw = window.localStorage.getItem(ACCESS_TOKEN_EXPIRY_STORAGE_KEY) || "";
          const storedExpiry = Number(storedExpiryRaw);
          const hasExpiry = Number.isFinite(storedExpiry) && storedExpiry > 0;
          if (!storedToken) return "";
          if (hasExpiry && storedExpiry - ACCESS_TOKEN_EXPIRY_SKEW_MS <= Date.now()) {
            clearPersistedAccessToken();
            return "";
          }
          return storedToken;
        } catch (error) {
          return "";
        }
      }

      function selectedCalendarId() {
        return calendarSelectEl.value || "primary";
      }

      function populateCalendars(calendars) {
        const items = Array.isArray(calendars) ? calendars.slice() : [];
        items.sort((a, b) => {
          if (a.primary && !b.primary) return -1;
          if (!a.primary && b.primary) return 1;
          return String(a.summary || "").localeCompare(String(b.summary || ""));
        });
        calendarSelectEl.innerHTML = "";
        if (!items.length) {
          const option = document.createElement("option");
          option.value = "primary";
          option.textContent = "Primary";
          calendarSelectEl.appendChild(option);
          calendarSelectEl.disabled = true;
          return;
        }
        for (const item of items) {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.primary ? `${item.summary} (Primary)` : item.summary;
          calendarSelectEl.appendChild(option);
        }
        calendarSelectEl.disabled = false;
      }

      function setStatus(message, kind = "") {
        statusEl.className = `status${kind ? ` ${kind}` : ""}`;
        statusEl.textContent = message;
      }

      function toCompactPayload(parsed) {
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("Payload must be a JSON object.");
        }

        if (Array.isArray(parsed.ev)) {
          return parsed;
        }

        if (!Array.isArray(parsed.events)) {
          throw new Error("Expanded payload must include an events array.");
        }

        const timezone = typeof parsed.timezone === "string" && parsed.timezone.trim()
          ? parsed.timezone.trim()
          : "Europe/Sofia";
        const ev = parsed.events.map((event, index) => {
          if (!event || typeof event !== "object" || Array.isArray(event)) {
            throw new Error(`events[${index}] must be an object.`);
          }
          const allDay = event.allDay === true;
          return {
            d: event.date,
            ...(allDay ? { ad: true } : { s: event.start, e: event.end }),
            t: event.title,
          };
        });
        return { tz: timezone, ev };
      }

      function toExpandedPayload(parsed) {
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          throw new Error("Payload must be a JSON object.");
        }
        if (!Array.isArray(parsed.ev)) {
          if (Array.isArray(parsed.events)) {
            return parsed;
          }
          throw new Error("Payload must include an ev array.");
        }
        return {
          timezone: typeof parsed.tz === "string" && parsed.tz.trim() ? parsed.tz.trim() : "Europe/Sofia",
          events: parsed.ev.map((event = {}) => ({
            date: event.d,
            ...(event.ad ? { allDay: true } : { start: event.s, end: event.e }),
            title: event.t,
          })),
        };
      }

      function base64UrlToUint8(base64Url) {
        const padded = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        const padLength = (4 - (padded.length % 4)) % 4;
        const base64 = padded + "=".repeat(padLength);
        const binary = window.atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function inflateRawToString(compressedBytes) {
        if (typeof DecompressionStream !== "function") {
          throw new Error("This browser does not support DecompressionStream.");
        }
        const ds = new DecompressionStream("deflate-raw");
        const stream = new Blob([compressedBytes]).stream().pipeThrough(ds);
        const response = new Response(stream);
        return response.text();
      }

      function updateAuthUi() {
        const connected = Boolean(accessToken);
        authStateEl.textContent = connected ? "Google: connected" : "Google: not connected";
        authActionBtn.disabled = authInProgress || googleAuthUnavailable;
        if (authInProgress) {
          authActionBtn.textContent = connected ? "Signing Out…" : "Signing In…";
        } else if (googleAuthUnavailable) {
          authActionBtn.textContent = "Google Auth Unavailable";
        } else {
          authActionBtn.textContent = connected ? "Sign Out" : "Sign In With Google";
        }
        authActionBtn.classList.toggle("secondary", connected);
        createBtn.disabled = googleAuthUnavailable || !connected || authInProgress;
        if (googleAuthUnavailable || !connected || authInProgress) {
          calendarSelectEl.disabled = true;
        }
      }

      async function loadCalendars() {
        const response = await fetch("/.netlify/functions/list-calendars", {
          headers: {
            accept: "application/json",
            authorization: `Bearer ${accessToken}`,
          },
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Failed to load calendars.");
        }
        populateCalendars(data.calendars || []);
      }

      async function decodePayloadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("payload64");
        if (!raw) {
          payloadEl.value = '{\n  "timezone": "Europe/Sofia",\n  "events": []\n}';
          setStatus("No payload64 parameter found. Paste JSON or reopen with ?payload64=...", "");
          return;
        }
        try {
          const compressed = base64UrlToUint8(raw);
          const minifiedJson = await inflateRawToString(compressed);
          const parsed = JSON.parse(minifiedJson);
          const expanded = toExpandedPayload(parsed);
          payloadEl.value = JSON.stringify(expanded, null, 2);
          setStatus("Loaded and expanded payload64 from URL.", "ok");
        } catch (error) {
          payloadEl.value = raw;
          setStatus("payload64 is not valid deflate+base64url JSON. You can correct it manually.", "error");
        }
      }

      async function loadConfig() {
        const response = await fetch("/.netlify/functions/runtime-config", {
          headers: { accept: "application/json" },
        });
        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          const bodyPreview = (await response.text()).slice(0, 120).trim();
          throw new Error(
            `Expected JSON from runtime-config but received ${contentType || "unknown content type"}${bodyPreview ? `: ${bodyPreview}` : ""}`,
          );
        }
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Failed to load runtime config.");
        }
        googleClientId = data.googleClientId || "";
        if (!googleClientId) {
          setStatus("Missing GOOGLE_CLIENT_ID in Netlify environment.", "error");
          authActionBtn.disabled = true;
          return;
        }
        setStatus("Configuration loaded. Sign in to enable event creation.", "");
      }

      function initGoogleAuth() {
        if (!window.google || !googleClientId) {
          return;
        }
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: googleClientId,
          scope: GOOGLE_SCOPES,
          error_callback: () => {
            finishAuthProgress();
          },
          callback: (response) => {
            finishAuthProgress();
            if (response && response.access_token) {
              accessToken = response.access_token;
              persistAccessToken(accessToken, response.expires_in);
              updateAuthUi();
              loadCalendars()
                .then(() => {
                  setStatus("Google access granted. You can now create events.", "ok");
                })
                .catch((error) => {
                  setStatus(`Signed in, but failed to load calendars: ${error.message}. Try signing out and signing in again to refresh consent.`, "error");
                });
            }
          },
        });
      }

      function requestSilentAccessToken() {
        if (!tokenClient) return;
        startAuthProgress();
        try {
          tokenClient.requestAccessToken({ prompt: "" });
        } catch (error) {
          finishAuthProgress();
          // Ignore silent auth failures; user can still use explicit sign-in.
        }
      }

      authActionBtn.addEventListener("click", () => {
        if (authInProgress) return;
        if (accessToken) {
          startAuthProgress();
          if (window.google && google.accounts && google.accounts.oauth2) {
            google.accounts.oauth2.revoke(accessToken, () => {});
          }
          accessToken = "";
          clearPersistedAccessToken();
          populateCalendars([]);
          finishAuthProgress();
          setStatus("Google access revoked for this page session.", "");
          return;
        }
        if (!tokenClient) {
          setStatus("Google auth is not ready yet.", "error");
          return;
        }
        startAuthProgress();
        tokenClient.requestAccessToken({ prompt: "consent" });
      });

      formatBtn.addEventListener("click", () => {
        try {
          const parsed = JSON.parse(payloadEl.value);
          const expanded = toExpandedPayload(toCompactPayload(parsed));
          payloadEl.value = JSON.stringify(expanded, null, 2);
          setStatus("JSON formatted.", "ok");
        } catch (error) {
          setStatus(`Cannot format JSON: ${error.message}`, "error");
        }
      });

      createBtn.addEventListener("click", async () => {
        if (!accessToken) {
          setStatus("Sign in with Google before creating events.", "error");
          return;
        }
        setStatus("Creating events…", "");
        createBtn.disabled = true;
        try {
          const parsed = JSON.parse(payloadEl.value);
          const compactPayload = toCompactPayload(parsed);
          const compactPayloadJson = JSON.stringify(compactPayload);
          payloadEl.value = JSON.stringify(toExpandedPayload(compactPayload), null, 2);
          const url = new URL("/.netlify/functions/create-events", window.location.origin);
          url.searchParams.set("calendarId", selectedCalendarId());
          const response = await fetch(url.toString(), {
            method: "POST",
            headers: {
              "content-type": "application/json",
              authorization: `Bearer ${accessToken}`,
            },
            body: compactPayloadJson,
          });
          const data = await response.json();
          payloadEl.value = payloadEl.value.trim();
          if (!response.ok) {
            setStatus(JSON.stringify(data, null, 2), "error");
            return;
          }
          setStatus(JSON.stringify(data, null, 2), "ok");
        } catch (error) {
          setStatus(`Request failed: ${error.message}`, "error");
        } finally {
          createBtn.disabled = !accessToken;
        }
      });

      async function boot() {
        const GOOGLE_SCRIPT_MAX_WAIT_MS = 12000;
        const GOOGLE_SCRIPT_POLL_INTERVAL_MS = 100;

        await decodePayloadFromUrl();
        accessToken = restoreAccessTokenFromStorage();
        populateCalendars([]);
        updateAuthUi();
        try {
          await loadConfig();
        } catch (error) {
          setStatus(`Failed to load runtime config: ${error.message}`, "error");
          authActionBtn.disabled = true;
          return;
        }
        const googleScriptWaitStartedAt = Date.now();
        let googleScriptResolved = false;
        const resolveGoogleScriptReady = () => {
          if (googleScriptResolved) return;
          googleScriptResolved = true;
          window.clearInterval(waitForGoogle);
          initGoogleAuth();
          if (accessToken) {
            loadCalendars()
              .then(() => {
                setStatus("Restored Google access from browser storage.", "ok");
              })
              .catch(() => {
                accessToken = "";
                clearPersistedAccessToken();
                updateAuthUi();
                requestSilentAccessToken();
                setStatus("Stored Google access token expired. Attempting silent sign-in.", "");
              });
          } else {
            requestSilentAccessToken();
          }
        };
        const resolveGoogleScriptTimeout = () => {
          if (googleScriptResolved) return;
          googleScriptResolved = true;
          googleAuthUnavailable = true;
          window.clearInterval(waitForGoogle);
          updateAuthUi();
          setStatus("Google auth script failed to load in time. Authentication is unavailable, so event creation is disabled.", "error");
        };
        const waitForGoogle = window.setInterval(() => {
          if (window.google) {
            resolveGoogleScriptReady();
            return;
          }
          if (Date.now() - googleScriptWaitStartedAt >= GOOGLE_SCRIPT_MAX_WAIT_MS) {
            resolveGoogleScriptTimeout();
          }
        }, GOOGLE_SCRIPT_POLL_INTERVAL_MS);
      }

      boot();
    </script>
  </body>
</html>
